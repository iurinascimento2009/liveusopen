<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Open | Live Scores</title>
    <style>
        :root {
            --us-open-blue: #002244;
            --us-open-yellow: #C1D82F;
            --bg-color: #f4f5f7;
            --text-color: #333333;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        .header {
            background-color: var(--us-open-blue);
            color: white;
            padding: 28px 0;
            text-align: center;
            border-bottom: 5px solid var(--us-open-yellow);
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p {
            margin: 8px 0 0 0;
            color: var(--us-open-yellow);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .container {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .widget-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 24px;
            min-height: 480px;
        }

        #powered-by {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }

        #powered-by-link {
            color: #004d99;
            text-decoration: none;
            margin-left: 4px;
            font-weight: 600;
        }

        #powered-by-link:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            padding: 25px 20px 40px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>US Open</h1>
        <p><span class="status-dot"></span>LIVE SCORES & MATCH TRACKER</p>
    </div>

    <div class="container">
        <div class="widget-wrapper">
            <!-- 365Scores Widget Container -->
            <div 
                data-widget-type="entityScores" 
                data-entity-type="league" 
                data-entity-id="230" 
                data-lang="en" 
                data-widget-id="ddf94157-4e67-407a-879c-2661ae17d391">
            </div>
            <div id="powered-by">
                Powered by <a id="powered-by-link" href="https://www.365scores.com" target="_blank" rel="noopener noreferrer">365Scores.com</a>
            </div>
        </div>
    </div>

    <div class="footer">
        Hosted via GitHub Pages
    </div>

    <!-- 365Scores Script -->
    <script src="https://widgets.365scores.com/main.js"></script>
</body>
</html>
