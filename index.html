<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Open 2026 | Live Scores</title>
    <style>
        :root {
            --us-open-blue: #002244;
            --us-open-yellow: #C1D82F;
            --bg-color: #f4f5f7;
            --text-color: #333333;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        .header {
            background-color: var(--us-open-blue);
            color: white;
            padding: 30px 0;
            text-align: center;
            border-bottom: 6px solid var(--us-open-yellow);
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p {
            margin: 10px 0 0 0;
            color: var(--us-open-yellow);
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .widget-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 30px;
            min-height: 500px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        #score-container {
            width: 100%;
            min-height: 450px;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #ddd;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>US Open 2026</h1>
        <p><span class="status-dot"></span>LIVE MATCH SCORES</p>
    </div>

    <div class="container">
        <div class="widget-wrapper">
            <div id="score-container">

        </div>

    <div class="footer">

    </div>

</body>
</html>
