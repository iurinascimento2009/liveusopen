<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Open 2026 | Live Scores</title>
    <style>
        :root {
            --us-open-blue: #002244;
            --us-open-yellow: #C1D82F;
            --bg-color: #f4f5f7;
            --text-color: #333333;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        .header {
            background-color: var(--us-open-blue);
            color: white;
            padding: 30px 0;
            text-align: center;
            border-bottom: 6px solid var(--us-open-yellow);
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p {
            margin: 10px 0 0 0;
            color: var(--us-open-yellow);
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .widget-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 30px;
            min-height: 500px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* Container for the injected HTML */
        #ts247-widget-container {
            width: 100%;
            min-height: 450px;
            overflow-x: auto;
        }

        /* Styling to make the injected table look clean */
        #ts247-widget-container table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        #ts247-widget-container th, #ts247-widget-container td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #ddd;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>US Open 2026</h1>
        <p><span class="status-dot"></span>LIVE MATCH SCORES</p>
    </div>

    <div class="container">
        <div class="widget-wrapper">
            <div id="ts247-widget-container">
                <p id="loading-text" style="text-align:center; color:#888; margin-top:100px;">
                    Fetching live data...
                </p>
            </div>
        </div>
    </div>

    <div class="footer">
        Data provided by TennisStats247. Hosted via GitHub Pages.
    </div>

    <!-- Client-side script to replace the PHP requirement -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // The exact URL from your PHP snippet
            const targetUrl = 'https://www.tennisstats247.com/TournamentResultsRssWidget.aspx?langId=1&tournamentId=11941&matches=8';
            
            // We use a free CORS proxy (allorigins) to allow GitHub Pages to fetch data from another domain
            const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

            fetch(proxyUrl)
                .then(response => response.json())
                .then(data => {
                    // Parse the XML feed returned by TennisStats247
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    
                    // Extract the HTML table hidden inside the <description> tag
                    const description = xmlDoc.querySelector("item description").textContent;
                    
                    // Inject the table directly into the page
                    document.getElementById('ts247-widget-container').innerHTML = description;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('loading-text').innerHTML = 'Live scores are currently unavailable. Please check back later.';
                });
        });
    </script>

</body>
</html>
