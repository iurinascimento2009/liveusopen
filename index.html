<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Open 2026 | Live Scores</title>
    <style>
        :root {
            --us-open-blue: #002244;
            --us-open-yellow: #C1D82F;
            --bg-color: #f4f5f7;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .header {
            background-color: var(--us-open-blue);
            color: white;
            padding: 25px 0;
            text-align: center;
            border-bottom: 6px solid var(--us-open-yellow);
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p {
            margin: 8px 0 0 0;
            color: var(--us-open-yellow);
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .widget-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 20px;
            min-height: 600px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 650px;
            border: none;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>US Open 2026</h1>
        <p><span class="status-dot"></span>LIVE MATCH SCORES</p>
    </div>

    <div class="container">
        <div class="widget-wrapper">
            <!-- SofaScore Free Iframe Widget for US Open Men's Singles -->
            <iframe 
                id="sofa-tournament-embed-2449" 
                src="https://widgets.sofascore.com/embed/tournament/2449/events" 
                title="Live US Open Scores"
                scrolling="yes">
            </iframe>
        </div>
    </div>

    <div class="footer">
        Data provided by SofaScore. Hosted securely via GitHub Pages.
    </div>

</body>
</html>
